# CI mínima (P2 de Pendientes): typecheck, lint, la prueba de la carta y el build en cada push
# y pull request. No usa secretos: sin variables de Supabase la app degrada sin romper (regla 11)
# y el build no toca la base. Vercel sigue desplegando solo `main`; esto no despliega nada.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fijadas por hash (una etiqueta se puede mover): v4.4.0 de cada una.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:carta
      - run: npm run test:auth
      - run: npm run test:esquema
      - run: npm run build
